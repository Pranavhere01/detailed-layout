<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FFF3F7">
<title>Booklet log 🧸</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E🧸%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF3F7; --plum:#3D2346; --muted:#6E4F79; --rose:#D12A63; --pink:#FF4F8B; --pink-t:#FFE0EB; --sun-t:#FFF0C2;
  --mint:#2EC4A0; --mint-t:#D5F7EE; --lilac-t:#EAE3FF; --card:#FFFFFF; --line:#F3D6E2;
  --head:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Mali","Baloo 2","Comic Neue",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:only light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--plum);font-family:var(--body);font-size:16px;line-height:1.45;
  padding:max(12px,env(safe-area-inset-top)) 12px max(24px,env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.15}
h1{font-size:1.7rem;text-align:center}
h1 small{display:block;font-size:.85rem;font-weight:600;color:var(--muted)}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;margin:14px 0;box-shadow:0 6px 18px rgba(61,35,70,.06)}
.card h2{font-size:1.15rem;margin-bottom:8px}
button,input{font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:999px;border:0;
  background:var(--pink);color:#fff;font-family:var(--head);font-weight:700;font-size:1rem;cursor:pointer;width:100%}
.btn.soft{background:var(--pink-t);color:var(--rose)}
.btn.tiny{width:auto;min-height:44px;padding:6px 14px;font-size:.9rem}
.btn:focus-visible,input:focus-visible,.sw input:focus-visible+span{outline:3px solid var(--rose);outline-offset:2px}
input[type=email]{width:100%;min-height:44px;border:2px solid var(--line);border-radius:14px;padding:8px 12px;color:var(--plum);background:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>*{flex:1 1 auto}
.note{color:var(--muted);font-size:.92rem;margin:8px 0 0}
.err{background:var(--sun-t);border-radius:14px;padding:10px 12px;margin-top:10px;font-size:.95rem}
.err:empty{display:none}
#who{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#who b{word-break:break-all}
.sw{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;user-select:none}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw span.k{width:46px;height:26px;border-radius:999px;background:#E9D7E2;position:relative;flex:none;transition:background .2s}
.sw span.k::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw input:checked+span.k{background:var(--pink)}
.sw input:checked+span.k::after{transform:translateX(20px)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg);border-radius:16px;padding:10px 12px}
.stat .l{font-size:.78rem;color:var(--muted);font-family:var(--head);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.stat .v{font-family:var(--head);font-weight:800;font-size:1.25rem;line-height:1.2}
.stat .s{font-size:.85rem;color:var(--muted)}
.stat.wide{grid-column:1/-1}
.hearts{font-size:1.3rem;letter-spacing:2px;color:var(--rose)}
.hearts .off{color:#D9C6D3}
ul.plain{list-style:none;margin:6px 0 0;padding:0}
ul.plain li{padding:3px 0;border-top:1px dashed var(--line);font-size:.93rem}
ul.plain li:first-child{border-top:0}
.day{font-family:var(--head);font-weight:800;color:var(--rose);margin:16px 4px 6px;font-size:1rem;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:1}
.ev{display:grid;grid-template-columns:62px 28px 1fr;gap:6px 8px;align-items:start;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px;margin:6px 0}
.ev time{font-family:var(--head);font-weight:700;color:var(--muted);font-size:.85rem;padding-top:2px}
.ev .e{font-size:1.15rem;text-align:center;color:var(--rose)}
.ev .s{font-size:.97rem}
.ev .b{grid-column:3;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-family:var(--head);font-weight:700;font-size:.72rem;border-radius:999px;padding:1px 8px;background:var(--lilac-t);color:#5A3FB8}
.tag.main{background:var(--pink-t);color:var(--rose)}
.tag.pages{background:var(--mint-t);color:#12735B}
.tag.me{background:var(--sun-t);color:#8A5A00}
.tag.divya{background:var(--pink-t);color:#9E1C49}
.tag.guest{background:#EFEAF3;color:#5B4A66}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
/* Teddy: quiz answers and transcripts, per device */
.dev{border-top:2px dashed var(--line);padding-top:12px;margin-top:12px}
.dev:first-child{border-top:0;padding-top:0;margin-top:0}
.dev h3{font-size:1rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.dev h3 small{font-weight:600;color:var(--muted);font-size:.82rem}
.qa{list-style:none;margin:6px 0 0;padding:0}
.qa li{display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:start;padding:6px 0;border-top:1px dashed var(--line);font-size:.93rem}
.qa li:first-child{border-top:0}
.qa .q{color:var(--muted)}
.qa .a{font-weight:600}
.qa .a.skip{font-weight:400;color:var(--muted);font-style:italic}
.tag.kind{background:var(--mint-t);color:#12735B}
.tag.skip{background:#EFEAF3;color:#5B4A66}
.tag.filt{background:var(--sun-t);color:#8A5A00}
.tag.teddy{background:var(--lilac-t);color:#5A3FB8}
.convo{margin-top:10px}
.convo .ch{font-family:var(--head);font-weight:700;font-size:.85rem;color:var(--muted);margin:8px 0 4px}
.msg{max-width:86%;padding:8px 12px;border-radius:18px;margin:4px 0;font-size:.95rem;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.msg.her{margin-left:auto;background:var(--pink-t);color:#9E1C49;border-bottom-right-radius:6px}
.msg.teddy{margin-right:auto;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.filtered{border:2px solid #E3B341}
.msg .m{display:block;font-size:.72rem;color:var(--muted);margin-top:4px;font-family:var(--head);font-weight:600}
.more{margin-top:8px}
.idx{font-size:.9rem;margin-top:8px}
.idx a{color:var(--rose);word-break:break-all}
.foot{text-align:center;color:var(--muted);font-size:.85rem;margin-top:22px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>🧸 Booklet log<small id="status">Connecting…</small></h1>

  <section class="card" id="signin">
    <h2>Sign in</h2>
    <p class="note" style="margin:0 0 10px">Only your account can read the log.</p>
    <button class="btn" id="google" type="button">Sign in with Google</button>
    <form id="emailForm" style="margin-top:12px" novalidate>
      <label for="email" class="note" style="display:block;margin:0 0 6px">Or get a sign-in link by email</label>
      <div class="row"><input type="email" id="email" autocomplete="email" placeholder="you@gmail.com" required><button class="btn soft tiny" type="submit">Email me a sign-in link</button></div>
    </form>
    <div class="err" id="authErr" role="alert"></div>
  </section>

  <section class="card" id="who" hidden>
    <span>Signed in as <b id="email-out"></b></span>
    <button class="btn soft tiny" id="signout" type="button">Sign out</button>
  </section>

  <section class="card" id="filters" hidden>
    <label class="sw"><input type="checkbox" id="showMe"><span class="k"></span><span>Show my own taps</span></label>
    <label class="sw"><input type="checkbox" id="onlyPages"><span class="k"></span><span>Only the public link</span></label>
    <div class="err" id="dataErr" role="alert"></div>
  </section>

  <section class="card" id="summary" hidden>
    <h2>Divya so far</h2>
    <div class="grid" id="stats"></div>
  </section>

  <section class="card" id="teddy" hidden>
    <h2>Teddy 🧸</h2>
    <p class="note" id="teddyNote">Quiz answers and chats, per device — newest first.</p>
    <div id="teddyOut"><p class="empty">Nothing from Teddy yet.</p></div>
  </section>

  <section id="timeline" hidden></section>
  <p class="foot">All times Indian time · newest first · refreshes live</p>
</main>

<script type="module">
const $ = s => document.querySelector(s);
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} }, del(k){ try { localStorage.removeItem(k); } catch {} } };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const setStatus = (t, ok) => { const s = $("#status"); s.textContent = t; s.className = ok ? "ok" : ""; };

/* ---------- IST helpers ---------- */
const TZ = "Asia/Kolkata";
const fTime = new Intl.DateTimeFormat("en-IN", { timeZone: TZ, hour: "numeric", minute: "2-digit", hour12: true });
const fDay = new Intl.DateTimeFormat("en-GB", { timeZone: TZ, weekday: "short", day: "numeric", month: "short" });
const fKey = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });
const hm = ms => fTime.format(ms).replace(/\s?(am|pm)/i, " $1").toLowerCase();
const dayName = ms => { const p = Object.fromEntries(fDay.formatToParts(ms).map(x => [x.type, x.value])); return `${p.weekday} ${p.day} ${p.month.slice(0, 3)}`; };
const dayKey = ms => fKey.format(ms);
const stamp = ms => `${dayName(ms)}, ${hm(ms)}`;
function ago(ms) {
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 45) return "just now"; const m = Math.round(s / 60); if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60); if (h < 36) return `${h} h ago`; return `${Math.round(h / 24)} days ago`;
}
function dayLabel(key, ms) {
  const today = dayKey(Date.now()), yest = dayKey(Date.now() - 864e5);
  return dayName(ms) + (key === today ? " · today" : key === yest ? " · yesterday" : "");
}

/* ---------- Sentences: type / k / v → words ---------- */
const PACK = ["Original photo ID", "Phone charger and power bank", "Something a little fancy", "Something modest for the Math", "Dancing shoes", "A light layer and a small umbrella", "Comfy clothes for Monday", "Some cash", "Earphones", "The chota suitcase"];
const LETTER = { now: "Open now", nervous: "Open when you're nervous", gate: "Open at the gate", takeoff: "Open after takeoff", land: "Open when you land", miss: "Open when you miss home", home: "Open on the flight home" };
const CHOICE = {
  "sat-pm": { title: "Saturday afternoon", arcade: "Arcade", boardgames: "Board games", ps5: "PS5 and a nap", later: "Decide later" },
  "sun-iskcon": { title: "Sunday morning", yes: "ISKCON, yes", sleep: "Sleep in", later: "Decide later" },
  "sat-night": { title: "Saturday night", dance: "Dance till tired", one: "One dance, then home", moon: "Just the moon, then bed", see: "See how she feels" },
  "mon-pick": { title: "Monday", movie: "A movie", tiramisu: "Tiramisu", momos: "Momos", iskcon: "ISKCON", home: "Stay home", later: "Decide later" },
  "food": { title: "Food picks", sushi: "Sushi", momos: "Momos", homefood: "Home food", tiramisu: "Tiramisu", surprise: "Surprise me" },
};
const SECTION = { top: "the top", now: "Now & next", nownext: "Now & next", plan: "the plan", route: "the route", fri: "Friday", sat: "Saturday", sun: "Sunday", mon: "Monday", tue: "Tuesday", pack: "Packing", letters: "Letters", marks: "Marks", choices: "Choices", moon: "the moon", quiz: "the quiz", map: "the map" };
const PART = { a: "Part (a), how you get here", b: "Part (b), Saturday", c: "Part (c), Sunday", d: "Part (d), Monday", e: "Part (e), Tuesday" };
// Teddy's step ids, as the booklet names them
function stepName(v) {
  const id = String(v ?? "");
  if (!id) return "a step";
  if (id === "pack") return "Packing"; if (id === "marks") return "the marks"; if (id === "tonight") return "tonight's plan"; if (id === "now") return "Now & next"; if (id === "done") return "the end of the list";
  if (id.startsWith("read-")) return PART[id.slice(5)] || id;
  if (id.startsWith("letter:")) return `the letter '${LETTER[id.slice(7)] || id.slice(7)}'`;
  if (id.startsWith("unlock:")) return `the just-unlocked '${LETTER[id.slice(7)] || id.slice(7)}'`;
  if (CHOICE[id]) return `the ${CHOICE[id].title} choice`;
  return SECTION[id] || id;
}
const choiceLabel = (q, v) => { const c = CHOICE[q] || {}; return String(v ?? "").split(",").map(x => x.trim()).filter(Boolean).map(x => c[x] || x).join(", ") || "cleared"; };
const choiceTitle = q => (CHOICE[q] && CHOICE[q].title) || q;
const yes = v => v === true || v === "true" || v === 1;
function sentence(e) {
  const { type, k, v } = e, K = esc(k), V = esc(v);
  switch (type) {
    case "mark":
      if (k === "sent") return ["📨", "Sent the marks on WhatsApp"];
      if (k === "clear") return ["🧽", "Cleared all the marks"];
      return [yes(v) ? "♥" : "♡", yes(v) ? `Gave Part (${K}) a mark ♥` : `Took the mark off Part (${K})`];
    case "marks_send": return ["📨", `Sent the marks on WhatsApp${v != null ? ` · ${V}/5` : ""}`];
    case "marks_clear": return ["🧽", "Cleared all the marks"];
    case "pack_done": return ["🎉", "All 10 packed"];
    case "copy_pnr": return ["📋", "Copied the PNR"];
    case "section": return ["👀", `Reached ${esc(SECTION[k] || k)}`];
    case "nav": return ["↕️", `Jumped to ${esc(SECTION[k] || k)}`];
    case "pack": { const i = Number(k); const name = PACK[i] ? ` · ${PACK[i]}` : ""; return [yes(v) ? "🧳" : "↩️", `${yes(v) ? "Packed" : "Unpacked"} item ${Number.isFinite(i) ? i + 1 : K}${name}`]; }
    case "letter": { const t = LETTER[k] || k; return v === "locked" ? ["🔒", `Tapped the locked '${esc(t)}'`] : v === "close" ? ["📪", `Closed '${esc(t)}'`] : ["💌", `Opened '${esc(t)}' 💌`]; }
    case "choice": return ["✅", `${esc(choiceTitle(k))}: ${esc(choiceLabel(k, v))}`];
    case "guide": {
      const st = esc(stepName(v));
      if (k === "go") return ["🧸", `Teddy took her to ${st}`];
      if (k === "skip") return ["⏭️", `Skipped Teddy's step: ${st}`];
      if (k === "auto") return ["🧸", `Teddy popped up: ${st}`];
      if (k === "open") return ["🧸", `Tapped Teddy, who suggested ${st}`];
      if (k === "later") return ["⏰", `Told Teddy "later" on ${st}`];
      if (k === "close") return ["🫧", "Closed Teddy's bubble"];
      if (k === "start") return ["🧸", "Started Teddy's tour"]; if (k === "done") return ["🎉", "Finished Teddy's tour"];
      if (k === "agent") return ["✨", `Teddy wrote his own suggestion${v && v !== "none" ? ` → ${V}` : " (pointing nowhere)"}`];  // the guide agent, 25 Sep 2026
      if (k === "ask") return ["💬", `Asked Teddy where to go (${V} letters)`];
      if (k === "answer") return ["✨", `Teddy answered${v && v !== "none" ? ` → ${V}` : " (pointing nowhere)"}`];
      if (k === "agent_err") return ["😴", `Teddy's guide words did not arrive (${V})`];
      return ["🧸", `Teddy: ${K}${v != null ? ` · ${V}` : ""}`];
    }
    case "login": return ["🪪", k === "divya" ? "Roll call: I'm Divya 🧸" : k === "guest" ? "Roll call: someone else" : `Roll call: ${K}`];
    case "open":
      if (k === "first") return ["🌸", "Opened the page for the first time"];
      if (k === "return" || k === "visible") return ["👋", `Came back to the page${v ? ` · resumed at ${esc(SECTION[v] || v)}` : ""}`];
      if (k === "resume") return ["👋", "Opened the page again"];
      return ["📖", `Opened the page${k && k !== "load" ? ` (${K})` : ""}`];
    case "hug": return ["🤗", `Hugged Teddy${v != null ? ` · ${V} so far` : ""}`];
    case "tap": return ["👆", `Tapped ${K}${v != null ? ` · ${V}` : ""}`];
    case "link": {
      const what = { map: "the map", home: "the home pin", spotify: "the playlist", cal: "the calendar", status: "the flight status", wa: "WhatsApp", whatsapp: "WhatsApp", call: "the call", ticket: "the ticket" }[k] || K;
      if (k === "cal") return ["🔗", `Added ${v === "back" ? "the flight home" : v === "out" ? "the flight out" : V} to the calendar`];
      if (k === "home" || k === "whatsapp") return ["🔗", `Opened ${esc(what)}`];
      return ["🔗", `Opened ${esc(what)}${v != null && v !== "" ? ` for ${V}` : ""}`];
    }
    case "quiz": return ["🎧", `Teddy's quiz: answered ${K}${v != null && v !== "" ? ` · ${V}` : ""}`];
    case "quiz_skip": return ["⏭️", `Teddy's quiz: skipped ${K}${v != null && v !== "" ? ` · ${V}` : ""}`];
    case "quiz_done": return ["🎉", `Finished Teddy's quiz${v != null && v !== "" ? ` · ${V}` : ""}`];
    case "chat_open": return ["🧸", `Opened Teddy's chat${k && k !== "tab" ? ` (${K})` : ""}${v != null && v !== "" ? ` · ${V}` : ""}`];
    case "chat_send": return ["💬", `Sent Teddy a message${k && k !== "send" ? ` (${K})` : ""}${v != null && v !== "" ? ` · ${V}` : ""}`];
    case "chat_reply": return ["🧸", `Teddy replied${k && k !== "ok" ? ` (${K})` : ""}${v != null && v !== "" ? ` · ${V}` : ""}`];
    case "install_hint": return ["📲", `Saw the install hint${k ? ` (${K})` : ""}${v != null && v !== "" ? ` · ${V}` : ""}`];
    case "install": {
      const what = { auto: "asked her to put Teddy on her home screen", tap: "opened the install guide",
                     how: "read the step-by-step", claimed: "says she added it to her home screen",
                     applied: "opened it from her home screen — installed ✓", later: "left it for later",
                     accepted: "accepted the install prompt", declined: "dismissed the install prompt" }[k] || k;
      return ["📲", `Home screen: ${what}${v != null && v !== "" ? ` · ${V}` : ""}`];
    }
    case "error": return ["⚠️", `Page error: ${K}${v != null ? ` · ${V}` : ""}`];
    default: return ["•", `${esc(type)}${k != null ? ` · ${K}` : ""}${v != null ? ` · ${V}` : ""}`];
  }
}

/* ---------- Summary ---------- */
const tOf = e => e.tms;
function summarise(evs /* her events, newest first */) {
  const last = evs[0];
  const devices = new Map();
  for (const e of evs) { const d = devices.get(e.sid) || { n: 0, first: tOf(e) }; d.n++; d.first = Math.min(d.first, tOf(e)); devices.set(e.sid, d); }
  const marks = {}; let sent = false;
  for (const e of evs) {  // newest first: a clear means everything older no longer counts
    if (e.type === "marks_send" || (e.type === "mark" && e.k === "sent") || (e.type === "link" && (e.k === "whatsapp" || e.k === "wa"))) sent = true;
    else if (e.type === "marks_clear" || (e.type === "mark" && e.k === "clear")) break;
    else if (e.type === "mark" && /^[a-e]$/.test(e.k) && !(e.k in marks)) marks[e.k] = yes(e.v);
  }
  const marksTotal = Object.values(marks).filter(Boolean).length;
  const pack = {}; for (const e of evs) if (e.type === "pack" && !(e.k in pack)) pack[e.k] = yes(e.v);
  const packed = Object.values(pack).filter(Boolean).length;
  const letters = {}; let locked = 0;
  for (let i = evs.length - 1; i >= 0; i--) { const e = evs[i]; if (e.type !== "letter") continue; if (e.v === "locked") locked++; else if (e.v !== "close" && !(e.k in letters)) letters[e.k] = tOf(e); }
  const choices = {}; for (const e of evs) if (e.type === "choice" && !(e.k in choices)) choices[e.k] = e.v;
  for (const q in choices) if (choices[q] === "" || choices[q] == null) delete choices[q];  // a cleared choice is not a choice
  let hugs = 0; for (const e of evs) if (e.type === "hug") hugs = Math.max(hugs, Number(e.v) || 0);
  const skipped = evs.filter(e => e.type === "guide" && e.k === "skip").length;
  const st = (l, v, s = "", wide = false) => `<div class="stat${wide ? " wide" : ""}"><div class="l">${l}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ""}</div>`;
  const hearts = ["a", "b", "c", "d", "e"].map(k => `<span class="${marks[k] ? "" : "off"}" title="Part (${k})">${marks[k] ? "♥" : "♡"}</span>`).join("");
  return [
    st("Last seen", last ? esc(stamp(tOf(last))) : "—", last ? `${ago(tOf(last))} · ${esc(last.ed || "?")}` : "nothing yet", true),
    st("Marks", `<span class="hearts">${hearts}</span>`, `${marksTotal}/5${sent ? " · sent 📨" : " · not sent yet"}`),
    st("Packed", `${packed}/10`, packed === 10 ? "all set 🧳" : ""),
    st("Hugs", String(hugs), "🤗"),
    st("Teddy steps skipped", String(skipped), ""),
    st("Letters opened", `${Object.keys(letters).length}/7`, `${locked} locked tap${locked === 1 ? "" : "s"}` + (Object.keys(letters).length ? `<ul class="plain">${Object.entries(letters).sort((a, b) => a[1] - b[1]).map(([k, t]) => `<li>💌 ${esc(LETTER[k] || k)} — ${esc(stamp(t))}</li>`).join("")}</ul>` : ""), true),
    st("Choices", Object.keys(choices).length ? "" : "—", Object.keys(choices).length ? `<ul class="plain">${Object.entries(choices).map(([q, v]) => `<li><b>${esc(choiceTitle(q))}</b>: ${esc(choiceLabel(q, v))}</li>`).join("")}</ul>` : "nothing chosen yet", true),
    st("Devices", String(devices.size), devices.size ? `<ul class="plain">${[...devices].map(([sid, d]) => `<li><span class="tag">${esc(String(sid || "?").slice(0, 4))}</span> ${d.n} event${d.n === 1 ? "" : "s"} · first ${esc(stamp(d.first))}</li>`).join("")}</ul>` : "", true),
  ].join("");
}

/* ---------- Render ---------- */
let all = [];   // newest first, normalised
function render() {
  const showMe = $("#showMe").checked, onlyPages = $("#onlyPages").checked;
  const isMe = e => e.me === true || e.sid === "mac" || e.who === "pranav";
  const shown = all.filter(e => (showMe || !isMe(e)) && (!onlyPages || e.ed === "pages"));
  const hers = all.filter(e => !isMe(e) && e.who !== "guest" && (!onlyPages || e.ed === "pages"));  // "someone else" readers stay in the timeline, out of her summary
  $("#stats").innerHTML = summarise(hers);
  const tl = $("#timeline");
  if (!shown.length) { tl.innerHTML = `<p class="empty">Nothing here yet — the page will fill up as she taps. 🧸</p>`; return; }
  let html = "", lastDay = "";
  for (const e of shown) {
    const key = dayKey(e.tms);
    if (key !== lastDay) { html += `<h3 class="day">${esc(dayLabel(key, e.tms))}</h3>`; lastDay = key; }
    const [emoji, words] = sentence(e);
    html += `<article class="ev"><time datetime="${new Date(e.tms).toISOString()}">${esc(hm(e.tms))}</time><span class="e" aria-hidden="true">${emoji}</span><div class="s">${words}</div>` +
      `<div class="b"><span class="tag ${e.ed === "pages" ? "pages" : "main"}">${esc(e.ed || "?")}</span><span class="tag">${esc(String(e.sid || "?").slice(0, 4))}</span>${e.who && !isMe(e) ? `<span class="tag ${e.who === "divya" ? "divya" : "guest"}">${esc(e.who)}</span>` : ""}${isMe(e) ? `<span class="tag me">me</span>` : ""}${e.sec ? `<span class="tag">${esc(e.sec)}</span>` : ""}${e.pending ? `<span class="tag me">sending…</span>` : ""}</div></article>`;
  }
  tl.innerHTML = html;
  setStatus(`${shown.length} of ${all.length} events · live`, true);
}
$("#showMe").addEventListener("change", render); $("#onlyPages").addEventListener("change", render);
window.__preview = evs => { all = evs.map(e => ({ ...e, tms: e.tms || e.ct })).sort((a, b) => b.tms - a.tms); for (const id of ["filters", "summary", "timeline"]) $(`#${id}`).hidden = false; render(); };  // dev: paste sample events

/* ---------- Teddy: quiz answers + transcripts, per device ----------
   Written by the chat server (Admin SDK): quiz/{sid}/answers/{qid} {t, who, qid, question, answer, kind, skipped}
   and chats/{sid}/turns/{id} {t, who, role user|assistant, content, mode, model, ms, filtered, sec}. */
let answers = [], turns = [];   // normalised, any order
const GAP = 30 * 60 * 1000;     // a pause this long starts a new conversation
const toMs = v => v && typeof v.toMillis === "function" ? v.toMillis() : typeof v === "number" ? v : typeof v === "string" ? (Date.parse(v) || 0) : 0;
const sid4 = sid => esc(String(sid || "?").slice(0, 4));
const whoTag = w => w && w !== "divya" ? `<span class="tag ${w === "pranav" ? "me" : "guest"}">${esc(w)}</span>` : w === "divya" ? `<span class="tag divya">divya</span>` : "";
function renderTeddy() {
  const out = $("#teddyOut");
  if (!answers.length && !turns.length) { out.innerHTML = `<p class="empty">Nothing from Teddy yet — the quiz and chats will show here as she talks to him. 🧸</p>`; return; }
  const devs = new Map();
  const dev = sid => { let d = devs.get(sid); if (!d) { d = { sid, who: "", last: 0, answers: [], turns: [] }; devs.set(sid, d); } return d; };
  for (const a of answers) { const d = dev(a.sid); d.answers.push(a); d.last = Math.max(d.last, a.tms); if (a.who) d.who = a.who; }
  for (const t of turns) { const d = dev(t.sid); d.turns.push(t); d.last = Math.max(d.last, t.tms); if (t.who) d.who = t.who; }
  let html = "";
  for (const d of [...devs.values()].sort((a, b) => b.last - a.last)) {
    d.answers.sort((a, b) => a.tms - b.tms); d.turns.sort((a, b) => a.tms - b.tms);
    html += `<div class="dev"><h3><span class="tag">${sid4(d.sid)}</span>${whoTag(d.who)}<small>${d.answers.length} answer${d.answers.length === 1 ? "" : "s"} · ${d.turns.length} turn${d.turns.length === 1 ? "" : "s"} · last ${esc(stamp(d.last))}</small></h3>`;
    if (d.answers.length) {
      html += `<ul class="qa">` + d.answers.map(a => {
        const skipped = yes(a.skipped) || a.answer == null || a.answer === "";
        return `<li><span><span class="q">${esc(a.question || a.qid)}</span> → <span class="a${skipped ? " skip" : ""}">${skipped ? "skipped" : esc(a.answer)}</span></span><span>${a.kind ? `<span class="tag kind">${esc(a.kind)}</span>` : ""}${skipped ? `<span class="tag skip">skip</span>` : ""}${a.pending ? `<span class="tag me">sending…</span>` : ""}</span></li>`;
      }).join("") + `</ul>`;
    }
    if (d.turns.length) {
      const convos = []; let cur = null, prev = 0;
      for (const t of d.turns) { if (!cur || t.tms - prev > GAP) { cur = []; convos.push(cur); } cur.push(t); prev = t.tms; }
      html += `<div class="convo">` + convos.reverse().map(c => {
        const filtered = c.filter(t => yes(t.filtered) || (typeof t.filtered === "string" && t.filtered)).length;
        return `<div class="ch">${esc(stamp(c[0].tms))} · ${c.length} turn${c.length === 1 ? "" : "s"}${filtered ? ` · ${filtered} filtered` : ""}</div>` + c.map(t => {
          const her = t.role === "user", f = yes(t.filtered) || (typeof t.filtered === "string" && t.filtered);
          const meta = [hm(t.tms), t.mode, t.model, t.ms != null ? `${Math.round(Number(t.ms) / 100) / 10}s` : "", t.sec].filter(Boolean).map(esc).join(" · ");
          return `<div class="msg ${her ? "her" : "teddy"}${f ? " filtered" : ""}">${esc(t.content)}${f ? ` <span class="tag filt" title="${esc(typeof t.filtered === "string" ? t.filtered : "filtered")}">filtered</span>` : ""}${t.pending ? ` <span class="tag me">sending…</span>` : ""}<span class="m">${her ? "her" : "Teddy"} · ${meta}</span></div>`;
        }).join("");
      }).join("") + `</div>`;
    }
    html += `</div>`;
  }
  out.innerHTML = html;
}
window.__previewTeddy = (as, ts) => {  // dev: paste sample answers and turns
  answers = (as || []).map(a => ({ ...a, tms: a.tms || toMs(a.t) })); turns = (ts || []).map(t => ({ ...t, tms: t.tms || toMs(t.t) }));
  $("#teddy").hidden = false; renderTeddy();
};
setInterval(() => { if (!$("#summary").hidden) render(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("#summary").hidden) render(); });

/* ---------- Firebase ---------- */
const WORDS = {
  "auth/operation-not-allowed": "Google sign-in isn't switched on in Firebase yet",
  "auth/configuration-not-found": "Firebase Authentication isn't set up for this project yet — open Firebase console → Authentication → Get started",
  "auth/unauthorized-domain": "This site's domain isn't in Firebase's authorised list yet",
  "auth/popup-blocked": "The browser blocked the sign-in popup — allow popups and try again",
  "auth/popup-closed-by-user": "The sign-in window was closed before finishing",
  "auth/cancelled-popup-request": "Another sign-in window was already open",
  "auth/network-request-failed": "No network — try again in a moment",
  "auth/invalid-email": "That email doesn't look right",
  "auth/missing-email": "Type your email first",
  "auth/invalid-action-code": "That sign-in link has already been used or is broken — ask for a new one",
  "auth/expired-action-code": "That sign-in link has expired — ask for a new one",
  "auth/quota-exceeded": "Too many sign-in emails for now — try later",
  "auth/user-disabled": "This account is disabled",
  "permission-denied": "This account can't read the log",
  "unavailable": "Firestore is unreachable right now — it will retry",
};
const plain = err => { const code = (err && err.code) || ""; return `${WORDS[code] || "Something went wrong"}${code ? ` (${code})` : ""}.`; };
const showAuthErr = err => { $("#authErr").textContent = err ? plain(err) : ""; };

let mods;
try {
  mods = await Promise.all([
    import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js"),
    import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js"),
  ]);
} catch (err) {
  setStatus("Offline"); $("#authErr").textContent = "Couldn't load Firebase — check the connection and reload.";
}

if (mods) {
  const [{ initializeApp }, A, F] = mods;
  const app = initializeApp({ apiKey: "AIzaSyBp8OXbn2Xj7mCVSWtuOHt6IVJN4WSd7sc", authDomain: "bangalore-in-detail-2026.firebaseapp.com", projectId: "bangalore-in-detail-2026", appId: "1:621180935719:web:4fd14f11ca22a5a2d63802" });
  const auth = A.getAuth(app), db = F.getFirestore(app);
  let unsub = null;

  const link = location.href.split("#")[0];
  $("#google").addEventListener("click", async () => {
    showAuthErr(null); setStatus("Signing in…");
    try { await A.signInWithPopup(auth, new A.GoogleAuthProvider()); } catch (err) { showAuthErr(err); setStatus("Not signed in"); }
  });
  $("#emailForm").addEventListener("submit", async ev => {
    ev.preventDefault(); showAuthErr(null);
    const email = $("#email").value.trim();
    if (!email) return showAuthErr({ code: "auth/missing-email" });
    try {
      await A.sendSignInLinkToEmail(auth, email, { url: link, handleCodeInApp: true });
      store.set("log-email", email); $("#authErr").textContent = `Sent. Open the link in the email on this phone to finish signing in.`;
    } catch (err) { showAuthErr(err); }
  });
  $("#signout").addEventListener("click", async () => { try { await A.signOut(auth); } catch (err) { showAuthErr(err); } });

  // Finish an email-link sign-in if we arrived through one
  if (A.isSignInWithEmailLink(auth, location.href)) {
    const email = store.get("log-email");
    if (email) {
      setStatus("Finishing sign-in…");
      A.signInWithEmailLink(auth, email, location.href).then(() => { store.del("log-email"); history.replaceState(null, "", link); }).catch(showAuthErr);
    } else { $("#authErr").textContent = "Type the email you asked the link for, then tap the email button again to confirm it."; $("#email").focus(); }
  }
  const prev = store.get("log-email"); if (prev) $("#email").value = prev;

  function subscribe() {
    if (unsub) unsub();
    $("#dataErr").textContent = ""; setStatus("Loading…");
    const q = F.query(F.collection(db, "events"), F.orderBy("t", "desc"), F.limit(1000));
    unsub = F.onSnapshot(q, snap => {
      all = snap.docs.map(d => { const e = d.data(); const tms = e.t && typeof e.t.toMillis === "function" ? e.t.toMillis() : (Number(e.ct) || 0); return { ...e, id: d.id, tms, pending: d.metadata.hasPendingWrites }; })
        .filter(e => e.tms > 0).sort((a, b) => b.tms - a.tms);
      render();
      if (teddy.fallback) ensureSidSubs();  // per-device listing needs the device ids the events know about
    }, err => { $("#dataErr").textContent = plain(err); $("#timeline").innerHTML = ""; $("#stats").innerHTML = ""; setStatus(err.code === "permission-denied" ? "No access" : "Error"); });
    subscribeTeddy();
  }

  /* Teddy: two collection-group listeners. Ordering a collection group by t needs a collection-group index (ops/firebase/firestore.indexes.json);
     until it exists Firestore answers "failed-precondition … requires an index" — we show that line (with its create-link) and fall back to
     listening per device id, which needs no extra index. */
  const teddy = { unsubs: [], fallback: false, sids: new Set(), errs: {} };
  const normA = (d, sid) => { const a = d.data(); return { ...a, id: d.id, sid: sid || (d.ref.parent.parent ? d.ref.parent.parent.id : "?"), qid: a.qid || d.id, tms: toMs(a.t), pending: d.metadata.hasPendingWrites }; };
  const normT = (d, sid) => { const t = d.data(); return { ...t, id: d.id, sid: sid || (d.ref.parent.parent ? d.ref.parent.parent.id : "?"), tms: toMs(t.t), pending: d.metadata.hasPendingWrites }; };
  const indexMissing = err => err && (err.code === "failed-precondition" || /index/i.test(err.message || ""));
  function teddyStatus() {
    const errs = Object.values(teddy.errs).filter(Boolean);
    if (!errs.length) { $("#teddyNote").innerHTML = teddy.fallback ? `Listing per device (${teddy.sids.size}) — the collection-group index isn't created yet.` : `Quiz answers and chats, per device — newest first · live`; return; }
    const msg = errs[0], link = (msg.match(/https:\/\/\S+/) || [""])[0];
    setStatus(msg.length > 90 ? msg.slice(0, 88) + "…" : msg);
    $("#teddyNote").innerHTML = `<span class="idx">${esc(msg.replace(link, "").trim())}${link ? ` <a href="${esc(link)}" target="_blank" rel="noopener">Create the index</a>` : ""}${teddy.fallback ? ` — meanwhile listing per device (${teddy.sids.size}).` : ""}</span>`;
  }
  function stopTeddy() { for (const u of teddy.unsubs) { try { u(); } catch {} } teddy.unsubs = []; teddy.fallback = false; teddy.sids = new Set(); teddy.errs = {}; answers = []; turns = []; }
  function subscribeTeddy() {
    stopTeddy();
    const onErr = which => err => {
      if (indexMissing(err)) { teddy.errs[which] = err.message || String(err); if (!teddy.fallback) { teddy.fallback = true; ensureSidSubs(); } teddyStatus(); }
      else { teddy.errs[which] = plain(err); teddyStatus(); }
    };
    teddy.unsubs.push(F.onSnapshot(F.query(F.collectionGroup(db, "answers"), F.orderBy("t", "desc"), F.limit(500)), snap => {
      if (teddy.fallback) return;
      answers = snap.docs.map(d => normA(d)); renderTeddy(); teddyStatus();
    }, onErr("answers")));
    teddy.unsubs.push(F.onSnapshot(F.query(F.collectionGroup(db, "turns"), F.orderBy("t", "desc"), F.limit(500)), snap => {
      if (teddy.fallback) return;
      turns = snap.docs.map(d => normT(d)); renderTeddy(); teddyStatus();
    }, onErr("turns")));
  }
  function ensureSidSubs() {  // fallback: one listener pair per device id the events collection knows
    const perSid = { a: new Map(), t: new Map() };
    teddy._per = teddy._per || perSid;
    const known = new Set(all.map(e => e.sid).filter(s => s && s !== "?"));
    for (const sid of known) {
      if (teddy.sids.has(sid)) continue;
      teddy.sids.add(sid);
      const merge = (store, m) => { const seen = new Map(); for (const list of m.values()) for (const x of list) seen.set(`${x.sid}/${x.id}`, x); return [...seen.values()]; };
      teddy.unsubs.push(F.onSnapshot(F.query(F.collection(db, "quiz", sid, "answers"), F.orderBy("t", "desc"), F.limit(100)), snap => {
        teddy._per.a.set(sid, snap.docs.map(d => normA(d, sid))); answers = merge("a", teddy._per.a); renderTeddy(); teddyStatus();
      }, err => { teddy.errs["quiz/" + sid] = plain(err); teddyStatus(); }));
      teddy.unsubs.push(F.onSnapshot(F.query(F.collection(db, "chats", sid, "turns"), F.orderBy("t", "desc"), F.limit(300)), snap => {
        teddy._per.t.set(sid, snap.docs.map(d => normT(d, sid))); turns = merge("t", teddy._per.t); renderTeddy(); teddyStatus();
      }, err => { teddy.errs["chats/" + sid] = plain(err); teddyStatus(); }));
    }
    teddyStatus();
  }

  A.onAuthStateChanged(auth, user => {
    const on = !!user;
    $("#signin").hidden = on; for (const id of ["who", "filters", "summary", "teddy", "timeline"]) $(`#${id}`).hidden = !on;
    if (on) { $("#email-out").textContent = user.email || user.uid; showAuthErr(null); subscribe(); }
    else { if (unsub) { unsub(); unsub = null; } all = []; stopTeddy(); teddy._per = null; renderTeddy(); setStatus("Not signed in"); }
  });
}
</script>
